<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090e1b"/>
      <stop offset="55%" stop-color="#0e1628"/>
      <stop offset="100%" stop-color="#12182e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="82%" cy="10%" r="38%">
      <stop offset="0%" stop-color="#9183ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9183ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="95%" r="32%">
      <stop offset="0%" stop-color="#4dd6d0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4dd6d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4bcff"/>
      <stop offset="55%" stop-color="#9183ff"/>
      <stop offset="100%" stop-color="#4dd6d0"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e2d4a"/>
      <stop offset="100%" stop-color="#1a2540"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow1)"/>
  <rect width="1200" height="340" fill="url(#glow2)"/>

  <!-- Decorative grid lines (subtle) -->
  <g stroke="#1e2d4a" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="85" x2="1200" y2="85"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="255" x2="1200" y2="255"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="1000" y1="0" x2="1000" y2="340"/>
  </g>

  <!-- Decorative circle accent top-right -->
  <circle cx="1090" cy="60" r="120" fill="none" stroke="#9183ff" stroke-width="0.8" opacity="0.25"/>
  <circle cx="1090" cy="60" r="80" fill="none" stroke="#4dd6d0" stroke-width="0.5" opacity="0.20"/>

  <!-- Decorative dots bottom-left -->
  <g fill="#9183ff" opacity="0.35">
    <circle cx="48" cy="270" r="3"/>
    <circle cx="68" cy="290" r="2"/>
    <circle cx="88" cy="270" r="3"/>
    <circle cx="108" cy="285" r="2"/>
    <circle cx="68" cy="250" r="2"/>
    <circle cx="48" cy="305" r="2"/>
    <circle cx="88" cy="305" r="3"/>
  </g>

  <!-- Pipeline preview strip (right side) -->
  <g transform="translate(760, 80)" opacity="0.85">
    <!-- Pipeline boxes -->
    <rect x="0" y="0" width="100" height="32" rx="6" fill="#1a2540" stroke="#9183ff" stroke-width="0.8"/>
    <text x="50" y="21" text-anchor="middle" font-family="monospace" font-size="11" fill="#c4bcff">Text Input</text>

    <line x1="50" y1="32" x2="50" y2="50" stroke="#9183ff" stroke-width="1.2" stroke-dasharray="3,2"/>
    <polygon points="44,48 56,48 50,56" fill="#9183ff"/>

    <rect x="0" y="56" width="100" height="32" rx="6" fill="#1a2540" stroke="#9183ff" stroke-width="0.8"/>
    <text x="50" y="77" text-anchor="middle" font-family="monospace" font-size="11" fill="#c4bcff">Tokenizer</text>

    <line x1="50" y1="88" x2="50" y2="106" stroke="#9183ff" stroke-width="1.2" stroke-dasharray="3,2"/>
    <polygon points="44,104 56,104 50,112" fill="#9183ff"/>

    <rect x="0" y="112" width="100" height="32" rx="6" fill="#1a2540" stroke="#4dd6d0" stroke-width="0.8"/>
    <text x="50" y="133" text-anchor="middle" font-family="monospace" font-size="11" fill="#a0f0ec">Embeddings</text>

    <line x1="50" y1="144" x2="50" y2="162" stroke="#4dd6d0" stroke-width="1.2" stroke-dasharray="3,2"/>
    <polygon points="44,160 56,160 50,168" fill="#4dd6d0"/>

    <rect x="0" y="168" width="100" height="32" rx="6" fill="#1a2540" stroke="#4dd6d0" stroke-width="0.8"/>
    <text x="50" y="189" text-anchor="middle" font-family="monospace" font-size="11" fill="#a0f0ec">Transformer</text>

    <line x1="100" y1="184" x2="128" y2="184" stroke="#63a6ff" stroke-width="1.2" stroke-dasharray="3,2"/>
    <polygon points="126,178 134,184 126,190" fill="#63a6ff"/>

    <rect x="134" y="168" width="100" height="32" rx="6" fill="#1a2540" stroke="#63a6ff" stroke-width="0.8"/>
    <text x="184" y="185" text-anchor="middle" font-family="monospace" font-size="10" fill="#a8c8ff">Attention</text>
    <text x="184" y="197" text-anchor="middle" font-family="monospace" font-size="10" fill="#a8c8ff">&amp; Logits</text>

    <line x1="184" y1="200" x2="184" y2="218" stroke="#ffb86b" stroke-width="1.2" stroke-dasharray="3,2"/>
    <polygon points="178,216 190,216 184,224" fill="#ffb86b"/>

    <rect x="134" y="224" width="100" height="32" rx="6" fill="#1a2540" stroke="#ffb86b" stroke-width="0.8"/>
    <text x="184" y="245" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffd4a0">Generation</text>
  </g>

  <!-- Main title -->
  <text x="72" y="118" font-family="'Segoe UI', system-ui, sans-serif" font-size="68" font-weight="800" fill="url(#title-grad)" letter-spacing="2">NEXUS LLM</text>

  <!-- Subtitle -->
  <text x="76" y="155" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" fill="#9eb0cc" letter-spacing="0.5">Language Intelligence &amp; Transformer Analysis Workbench</text>

  <!-- Description -->
  <text x="76" y="195" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#7a90b0">An interactive educational workbench to explore how Large Language Models</text>
  <text x="76" y="214" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#7a90b0">tokenize, represent, attend, predict, and generate language — step by step.</text>

  <!-- Divider line -->
  <line x1="76" y1="235" x2="680" y2="235" stroke="#2a3a58" stroke-width="1"/>

  <!-- Tech badges row -->
  <g transform="translate(76, 252)">
    <!-- Python -->
    <rect width="70" height="26" rx="5" fill="#1e2a40" stroke="#3a4f6e" stroke-width="0.8"/>
    <text x="35" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#4dd6d0">Python</text>

    <!-- PyTorch -->
    <rect x="78" y="0" width="72" height="26" rx="5" fill="#1e2a40" stroke="#3a4f6e" stroke-width="0.8"/>
    <text x="114" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff7f50">PyTorch</text>

    <!-- HuggingFace -->
    <rect x="158" y="0" width="118" height="26" rx="5" fill="#1e2a40" stroke="#3a4f6e" stroke-width="0.8"/>
    <text x="217" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffb86b">HuggingFace</text>

    <!-- Gradio -->
    <rect x="284" y="0" width="66" height="26" rx="5" fill="#1e2a40" stroke="#3a4f6e" stroke-width="0.8"/>
    <text x="317" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#9183ff">Gradio</text>

    <!-- DistilGPT2 -->
    <rect x="358" y="0" width="90" height="26" rx="5" fill="#1e2a40" stroke="#3a4f6e" stroke-width="0.8"/>
    <text x="403" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#c4bcff">DistilGPT2</text>

    <!-- 5 Labs -->
    <rect x="456" y="0" width="66" height="26" rx="5" fill="#1e2a40" stroke="#9183ff" stroke-width="0.8"/>
    <text x="489" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#c4bcff">5 Labs</text>
  </g>

  <!-- Decorative bottom border -->
  <rect x="0" y="330" width="1200" height="10" rx="0">
    <animate attributeName="fill" values="#9183ff;#4dd6d0;#63a6ff;#9183ff" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="330" width="1200" height="2" fill="url(#title-grad)" opacity="0.8"/>
</svg>

