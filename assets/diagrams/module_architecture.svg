<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090e1b"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9183ff"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4dd6d0"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#74d99f"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="18" font-weight="700" fill="#c4bcff">NEXUS LLM — Five-Module Architecture</text>
  <text x="480" y="52" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#6a80a0">app.py · Gradio Interface · Shared Model Resources · Five Interactive Labs</text>

  <!-- ===== APP.PY / GRADIO shell ===== -->
  <rect x="40" y="68" width="880" height="445" rx="16" fill="none" stroke="#2a3a58" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="60" y="88" font-family="monospace" font-size="11" fill="#4a5f80">app.py  ·  Gradio Blocks Interface</text>

  <!-- Shared model resource box (top center) -->
  <rect x="310" y="95" width="340" height="64" rx="10" fill="#131c30" stroke="#9183ff" stroke-width="1.5"/>
  <text x="480" y="116" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#c4bcff">Shared Model Resources</text>
  <text x="480" y="131" text-anchor="middle" font-family="monospace" font-size="10" fill="#6a80a0">get_resources() → DistilGPT2 tokenizer + model · loaded once · reused across all tabs</text>
  <text x="480" y="148" text-anchor="middle" font-family="monospace" font-size="10" fill="#6a80a0">AutoTokenizer + AutoModelForCausalLM · DEVICE: CPU/CUDA · MAX_INPUT: 128 tokens</text>

  <!-- Module boxes row -->
  <!-- Lab 01 -->
  <rect x="58" y="210" width="156" height="270" rx="10" fill="#12172a" stroke="#9183ff" stroke-width="1.5"/>
  <rect x="58" y="210" width="156" height="32" rx="10" fill="#1a1a3a"/>
  <rect x="58" y="230" width="156" height="12" rx="0" fill="#1a1a3a"/>
  <text x="136" y="231" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#9183ff">01 · Tokenization</text>
  <text x="136" y="260" text-anchor="middle" font-family="monospace" font-size="9" fill="#a0a8c0">run_tokenization(text)</text>
  <text x="136" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">BPE subword split</text>
  <text x="136" y="291" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">token ID bar chart</text>
  <text x="136" y="306" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">attention mask viz</text>
  <text x="136" y="321" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">round-trip decode</text>
  <text x="136" y="336" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">special token info</text>
  <text x="136" y="351" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">per-token table</text>
  <line x1="68" y1="363" x2="204" y2="363" stroke="#2a3a58" stroke-width="0.8"/>
  <text x="136" y="377" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">modules/tokenization/</text>
  <text x="136" y="390" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">tokenizer.py</text>
  <text x="136" y="403" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">notebooks/01.tokenization</text>
  <text x="136" y="427" text-anchor="middle" font-family="monospace" font-size="9" fill="#9183ff">DistilGPT2 tokenizer</text>
  <text x="136" y="441" text-anchor="middle" font-family="monospace" font-size="9" fill="#9183ff">vocab: 50,257</text>
  <text x="136" y="462" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a80a0">Output: 7 components</text>

  <!-- Lab 02 -->
  <rect x="228" y="210" width="156" height="270" rx="10" fill="#0d1e2a" stroke="#4dd6d0" stroke-width="1.5"/>
  <rect x="228" y="210" width="156" height="32" rx="10" fill="#0d2230"/>
  <rect x="228" y="230" width="156" height="12" rx="0" fill="#0d2230"/>
  <text x="306" y="231" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#4dd6d0">02 · Embeddings</text>
  <text x="306" y="260" text-anchor="middle" font-family="monospace" font-size="9" fill="#a0a8c0">run_embeddings(text)</text>
  <text x="306" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">768-dim input vectors</text>
  <text x="306" y="291" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">contextual reps (last layer)</text>
  <text x="306" y="306" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">embedding heatmap</text>
  <text x="306" y="321" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">PCA 2D projection</text>
  <text x="306" y="336" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">vector norms chart</text>
  <text x="306" y="351" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">sentence similarity</text>
  <line x1="238" y1="363" x2="374" y2="363" stroke="#2a3a58" stroke-width="0.8"/>
  <text x="306" y="377" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">modules/embedding/</text>
  <text x="306" y="390" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">embedding.py</text>
  <text x="306" y="403" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">notebooks/02.embedding</text>
  <text x="306" y="427" text-anchor="middle" font-family="monospace" font-size="9" fill="#4dd6d0">DistilGPT2 (wte+wpe)</text>
  <text x="306" y="441" text-anchor="middle" font-family="monospace" font-size="9" fill="#4dd6d0">all-MiniLM-L6-v2</text>
  <text x="306" y="462" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a80a0">Output: 5 components</text>

  <!-- Lab 03 -->
  <rect x="398" y="210" width="156" height="270" rx="10" fill="#0e1828" stroke="#63a6ff" stroke-width="1.5"/>
  <rect x="398" y="210" width="156" height="32" rx="10" fill="#102030"/>
  <rect x="398" y="230" width="156" height="12" rx="0" fill="#102030"/>
  <text x="476" y="231" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#63a6ff">03 · Transformer</text>
  <text x="476" y="260" text-anchor="middle" font-family="monospace" font-size="9" fill="#a0a8c0">run_transformer_inspection</text>
  <text x="476" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">layer + head selection</text>
  <text x="476" y="291" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">attention heatmap</text>
  <text x="476" y="306" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">hidden-state magnitudes</text>
  <text x="476" y="321" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">Q / K / V projection</text>
  <text x="476" y="336" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">layer depth chart</text>
  <text x="476" y="351" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">token-to-token flow</text>
  <line x1="408" y1="363" x2="544" y2="363" stroke="#2a3a58" stroke-width="0.8"/>
  <text x="476" y="377" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">modules/transformer/</text>
  <text x="476" y="390" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">transformer.py</text>
  <text x="476" y="403" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">notebooks/03.transformer</text>
  <text x="476" y="427" text-anchor="middle" font-family="monospace" font-size="9" fill="#63a6ff">DistilGPT2 + eager attn</text>
  <text x="476" y="441" text-anchor="middle" font-family="monospace" font-size="9" fill="#63a6ff">6 layers · 12 heads</text>
  <text x="476" y="462" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a80a0">Output: 5 components</text>

  <!-- Lab 04 -->
  <rect x="568" y="210" width="156" height="270" rx="10" fill="#1a1030" stroke="#ffb86b" stroke-width="1.5"/>
  <rect x="568" y="210" width="156" height="32" rx="10" fill="#1e1428"/>
  <rect x="568" y="230" width="156" height="12" rx="0" fill="#1e1428"/>
  <text x="646" y="231" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffb86b">04 · Next Token</text>
  <text x="646" y="260" text-anchor="middle" font-family="monospace" font-size="9" fill="#a0a8c0">run_next_token_prediction</text>
  <text x="646" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">final-position logits</text>
  <text x="646" y="291" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">temperature scaling</text>
  <text x="646" y="306" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">top-k filtering</text>
  <text x="646" y="321" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">top-p (nucleus) filter</text>
  <text x="646" y="336" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">probability bar chart</text>
  <text x="646" y="351" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">cumulative curve</text>
  <line x1="578" y1="363" x2="714" y2="363" stroke="#2a3a58" stroke-width="0.8"/>
  <text x="646" y="377" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">modules/predection/</text>
  <text x="646" y="390" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">predection.py</text>
  <text x="646" y="403" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">notebooks/04_next_token</text>
  <text x="646" y="427" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffb86b">DistilGPT2 logits</text>
  <text x="646" y="441" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffb86b">softmax · top-15</text>
  <text x="646" y="462" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a80a0">Output: 4 components</text>

  <!-- Lab 05 -->
  <rect x="738" y="210" width="156" height="270" rx="10" fill="#0a1e10" stroke="#74d99f" stroke-width="1.5"/>
  <rect x="738" y="210" width="156" height="32" rx="10" fill="#0d2215"/>
  <rect x="738" y="230" width="156" height="12" rx="0" fill="#0d2215"/>
  <text x="816" y="231" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#74d99f">05 · Generation</text>
  <text x="816" y="260" text-anchor="middle" font-family="monospace" font-size="9" fill="#a0a8c0">run_generation(prompt,...)</text>
  <text x="816" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">greedy / sampling</text>
  <text x="816" y="291" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">temperature · top-k/p</text>
  <text x="816" y="306" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">repetition penalty</text>
  <text x="816" y="321" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">no-repeat n-gram</text>
  <text x="816" y="336" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">per-step confidence</text>
  <text x="816" y="351" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">token timeline HTML</text>
  <line x1="748" y1="363" x2="884" y2="363" stroke="#2a3a58" stroke-width="0.8"/>
  <text x="816" y="377" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">modules/generation/</text>
  <text x="816" y="390" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">generation.py</text>
  <text x="816" y="403" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a5f80">notebooks/05_generation_lab</text>
  <text x="816" y="427" text-anchor="middle" font-family="monospace" font-size="9" fill="#74d99f">model.generate() + KV</text>
  <text x="816" y="441" text-anchor="middle" font-family="monospace" font-size="9" fill="#74d99f">use_cache=True</text>
  <text x="816" y="462" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a80a0">Output: 6 components</text>

  <!-- Arrows from shared resource box down to each lab -->
  <line x1="380" y1="159" x2="136" y2="210" stroke="#9183ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-p)"/>
  <line x1="420" y1="159" x2="306" y2="210" stroke="#4dd6d0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-c)"/>
  <line x1="480" y1="159" x2="476" y2="210" stroke="#63a6ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-p)"/>
  <line x1="540" y1="159" x2="646" y2="210" stroke="#ffb86b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-p)"/>
  <line x1="580" y1="159" x2="816" y2="210" stroke="#74d99f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
</svg>

