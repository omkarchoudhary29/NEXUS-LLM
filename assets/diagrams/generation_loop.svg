<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090e1b"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9183ff"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#74d99f"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="18" font-weight="700" fill="#c4bcff">AUTOREGRESSIVE GENERATION LOOP</text>
  <text x="450" y="52" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#6a80a0">How the model generates text one token at a time using KV cache</text>

  <!-- Step 0: Prompt -->
  <rect x="30" y="78" width="155" height="64" rx="10" fill="#131c30" stroke="#9183ff" stroke-width="1.8"/>
  <text x="108" y="100" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#c4bcff">Step 0: Prompt</text>
  <text x="108" y="116" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">"The future of AI"</text>
  <text x="108" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">tokenize → input_ids</text>

  <!-- Arrow 0 → 1 -->
  <line x1="185" y1="110" x2="222" y2="110" stroke="#9183ff" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step 1: Forward Pass -->
  <rect x="224" y="78" width="160" height="64" rx="10" fill="#131c30" stroke="#4dd6d0" stroke-width="1.8"/>
  <text x="304" y="98" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#4dd6d0">Forward Pass</text>
  <text x="304" y="113" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">embeddings → 6 blocks</text>
  <text x="304" y="127" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">attention + FFN × 6</text>
  <text x="304" y="140" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">output: hidden states</text>

  <!-- Arrow 1 → 2 -->
  <line x1="384" y1="110" x2="422" y2="110" stroke="#9183ff" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step 2: Logits -->
  <rect x="424" y="78" width="145" height="64" rx="10" fill="#1a1030" stroke="#9183ff" stroke-width="1.8"/>
  <text x="497" y="98" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#9183ff">LM Head</text>
  <text x="497" y="113" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">last hidden [−1]</text>
  <text x="497" y="127" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">linear 768 → 50,257</text>
  <text x="497" y="140" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">raw logit scores</text>

  <!-- Arrow 2 → 3 -->
  <line x1="569" y1="110" x2="606" y2="110" stroke="#ffb86b" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step 3: Sampling -->
  <rect x="608" y="78" width="155" height="64" rx="10" fill="#1a1030" stroke="#ffb86b" stroke-width="1.8"/>
  <text x="686" y="97" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffb86b">Sampling Filter</text>
  <text x="686" y="112" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">÷ temperature</text>
  <text x="686" y="126" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">top-k mask · top-p mask</text>
  <text x="686" y="140" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">softmax → probs</text>

  <!-- Arrow 3 → 4 -->
  <line x1="763" y1="110" x2="800" y2="110" stroke="#74d99f" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Step 4: Token Selection -->
  <rect x="802" y="78" width="80" height="64" rx="10" fill="#0a1e10" stroke="#74d99f" stroke-width="1.8"/>
  <text x="842" y="97" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#74d99f">Select</text>
  <text x="842" y="110" text-anchor="middle" font-family="monospace" font-size="9" fill="#74d99f">Token</text>
  <text x="842" y="126" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a80a0">argmax or</text>
  <text x="842" y="138" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a80a0">multinomial</text>

  <!-- KV Cache arrow (going back) -->
  <line x1="842" y1="142" x2="842" y2="210" stroke="#74d99f" stroke-width="1.3" stroke-dasharray="5,3"/>
  <line x1="842" y1="210" x2="305" y2="210" stroke="#74d99f" stroke-width="1.3" stroke-dasharray="5,3"/>
  <line x1="305" y1="210" x2="305" y2="144" stroke="#74d99f" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>
  <text x="573" y="203" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#74d99f">KV Cache (use_cache=True) — avoids recomputing past keys/values each step</text>

  <!-- Append arrow (going back to front) -->
  <line x1="842" y1="142" x2="842" y2="250" stroke="#9183ff" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="842" y1="250" x2="108" y2="250" stroke="#9183ff" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="108" y1="250" x2="108" y2="143" stroke="#9183ff" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-p)"/>
  <text x="473" y="265" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#9183ff">append new token to context → repeat until EOS or max_new_tokens</text>

  <!-- Stopping conditions box -->
  <rect x="200" y="290" width="240" height="80" rx="8" fill="#1a1030" stroke="#9183ff" stroke-width="0.8" stroke-dasharray="4,2"/>
  <text x="320" y="312" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#9183ff">Stopping Conditions</text>
  <text x="320" y="329" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">EOS token generated (token_id = 50256)</text>
  <text x="320" y="345" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">max_new_tokens reached (10–150)</text>
  <text x="320" y="361" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">repetition_penalty · no_repeat_ngram</text>

  <!-- Decoding strategies box -->
  <rect x="480" y="290" width="240" height="80" rx="8" fill="#0a1e10" stroke="#74d99f" stroke-width="0.8"/>
  <text x="600" y="312" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#74d99f">Decoding Strategies</text>
  <text x="600" y="329" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">Greedy: do_sample=False → argmax</text>
  <text x="600" y="345" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">Sampling: do_sample=True + temp</text>
  <text x="600" y="361" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">Top-K + Top-P combined nucleus</text>

  <!-- Output example -->
  <rect x="30" y="390" width="840" height="36" rx="8" fill="#0d2215" stroke="#74d99f" stroke-width="0.8"/>
  <text x="450" y="403" text-anchor="middle" font-family="monospace" font-size="10" fill="#6a80a0">Input:</text>
  <text x="490" y="403" font-family="monospace" font-size="10" fill="#c4bcff">"The future of AI"</text>
  <text x="620" y="403" font-family="monospace" font-size="10" fill="#6a80a0">→ Generated:</text>
  <text x="700" y="403" font-family="monospace" font-size="10" fill="#74d99f">"The future of AI is transforming the way we think about..."</text>
  <text x="450" y="419" text-anchor="middle" font-family="monospace" font-size="9" fill="#4a5f80">Each token generated one step at a time · confidence tracked per step · timeline displayed in Lab 05</text>
</svg>

