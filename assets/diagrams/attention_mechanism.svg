<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090e1b"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9183ff"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4dd6d0"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ffb86b"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="18" font-weight="700" fill="#c4bcff">SELF-ATTENTION MECHANISM</text>
  <text x="450" y="52" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#6a80a0">How each token attends to all other tokens · DistilGPT2 · 6 layers · 12 heads</text>

  <!-- Input tokens (left) -->
  <g transform="translate(40, 95)">
    <text x="60" y="-12" text-anchor="middle" font-family="monospace" font-size="11" fill="#6a80a0">Input Tokens</text>
    <rect x="0" y="0" width="120" height="32" rx="7" fill="#131c30" stroke="#9183ff" stroke-width="1.2"/>
    <text x="60" y="21" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4bcff">"Large"</text>

    <rect x="0" y="50" width="120" height="32" rx="7" fill="#131c30" stroke="#9183ff" stroke-width="1.2"/>
    <text x="60" y="71" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4bcff">"language"</text>

    <rect x="0" y="100" width="120" height="32" rx="7" fill="#131c30" stroke="#9183ff" stroke-width="1.2"/>
    <text x="60" y="121" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4bcff">"models"</text>

    <rect x="0" y="150" width="120" height="32" rx="7" fill="#131c30" stroke="#9183ff" stroke-width="1.2"/>
    <text x="60" y="171" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4bcff">"learn"</text>

    <rect x="0" y="200" width="120" height="32" rx="7" fill="#131c30" stroke="#9183ff" stroke-width="1.2"/>
    <text x="60" y="221" text-anchor="middle" font-family="monospace" font-size="12" fill="#c4bcff">"patterns"</text>
  </g>

  <!-- QKV Projection box -->
  <rect x="230" y="95" width="140" height="240" rx="10" fill="#12172a" stroke="#4dd6d0" stroke-width="1.5"/>
  <text x="300" y="115" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#4dd6d0">QKV Projection</text>
  <text x="300" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">Linear(768, 768×3)</text>
  <text x="300" y="148" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">c_attn weight</text>

  <rect x="245" y="160" width="110" height="26" rx="5" fill="#1a2040" stroke="#9183ff" stroke-width="0.8"/>
  <text x="300" y="177" text-anchor="middle" font-family="monospace" font-size="11" fill="#9183ff">Q · Query</text>

  <rect x="245" y="196" width="110" height="26" rx="5" fill="#0d2230" stroke="#4dd6d0" stroke-width="0.8"/>
  <text x="300" y="213" text-anchor="middle" font-family="monospace" font-size="11" fill="#4dd6d0">K · Key</text>

  <rect x="245" y="232" width="110" height="26" rx="5" fill="#1a1820" stroke="#ffb86b" stroke-width="0.8"/>
  <text x="300" y="249" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffb86b">V · Value</text>

  <text x="300" y="284" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">split(768, dim=2)</text>
  <text x="300" y="298" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">12 heads × 64 dims</text>
  <text x="300" y="313" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">each head: 64-dim space</text>

  <!-- Attention Score box -->
  <rect x="430" y="140" width="150" height="155" rx="10" fill="#1a1030" stroke="#9183ff" stroke-width="1.5"/>
  <text x="505" y="162" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#9183ff">Attention Scores</text>
  <text x="505" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">QKᵀ / √64</text>
  <text x="505" y="196" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">causal mask (lower-tri)</text>
  <text x="505" y="212" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">future tokens = -∞</text>
  <text x="505" y="232" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffb86b">softmax( QKᵀ/√d_k )</text>
  <text x="505" y="250" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">attention weights ∈ [0,1]</text>
  <text x="505" y="268" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">shape: (heads, seq, seq)</text>
  <text x="505" y="284" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">→ heatmap in Lab 03</text>

  <!-- Context vector box -->
  <rect x="640" y="140" width="150" height="155" rx="10" fill="#0a1e10" stroke="#74d99f" stroke-width="1.5"/>
  <text x="715" y="162" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#74d99f">Context Vectors</text>
  <text x="715" y="180" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">Attn_weights × V</text>
  <text x="715" y="196" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">weighted sum over tokens</text>
  <text x="715" y="212" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">each token "sees" all others</text>
  <text x="715" y="232" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#74d99f">c_proj linear layer</text>
  <text x="715" y="250" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">concat 12 heads → 768</text>
  <text x="715" y="268" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">residual + layer norm</text>
  <text x="715" y="284" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">→ feed-forward block</text>

  <!-- Arrows: tokens → QKV -->
  <line x1="160" y1="111" x2="228" y2="155" stroke="#9183ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="160" y1="161" x2="228" y2="195" stroke="#9183ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="160" y1="211" x2="228" y2="215" stroke="#9183ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="160" y1="261" x2="228" y2="245" stroke="#9183ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="160" y1="311" x2="228" y2="280" stroke="#9183ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Q,K → Attention -->
  <line x1="370" y1="173" x2="428" y2="195" stroke="#9183ff" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="370" y1="209" x2="428" y2="210" stroke="#4dd6d0" stroke-width="1.2" marker-end="url(#arr-c)"/>
  <text x="400" y="188" text-anchor="middle" font-family="monospace" font-size="9" fill="#9183ff">Q</text>
  <text x="400" y="225" text-anchor="middle" font-family="monospace" font-size="9" fill="#4dd6d0">K</text>

  <!-- V → Context -->
  <line x1="370" y1="245" x2="540" y2="270" stroke="#ffb86b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="450" y="265" font-family="monospace" font-size="9" fill="#ffb86b">V</text>

  <!-- Attention → Context -->
  <line x1="580" y1="218" x2="638" y2="218" stroke="#9183ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="608" y="212" text-anchor="middle" font-family="monospace" font-size="9" fill="#9183ff">weights</text>

  <!-- Causal mask note -->
  <rect x="400" y="370" width="200" height="80" rx="8" fill="#1a1030" stroke="#9183ff" stroke-width="0.8" stroke-dasharray="4,2"/>
  <text x="500" y="390" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#9183ff">Causal Masking</text>
  <text x="500" y="407" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">GPT-2 is decoder-only</text>
  <text x="500" y="422" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">each token only attends</text>
  <text x="500" y="437" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">to itself and past tokens</text>

  <!-- Model info box -->
  <rect x="640" y="330" width="200" height="100" rx="8" fill="#0a1e10" stroke="#74d99f" stroke-width="0.8"/>
  <text x="740" y="350" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#74d99f">DistilGPT2 Dims</text>
  <text x="740" y="368" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">Layers: 6 transformer blocks</text>
  <text x="740" y="383" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">Heads: 12 per layer</text>
  <text x="740" y="398" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">Hidden: 768 dims</text>
  <text x="740" y="413" text-anchor="middle" font-family="monospace" font-size="9" fill="#6a80a0">Head dim: 64</text>
</svg>

